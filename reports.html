<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Sales Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">📊 Sales Management System</span>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <!-- Sidebar Navigation -->
        <div class="col-md-3">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    Menu
                </div>
                <div class="list-group list-group-flush">
                    <a href="index.html" class="list-group-item list-group-item-action">Dashboard / Sales</a>
                    <a href="reports.html" class="list-group-item list-group-item-action active">Reports</a>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-9">

            <!-- KPI Overview Row -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-center shadow-sm border-0 bg-primary text-white">
                        <div class="card-body">
                            <h6 class="card-subtitle mb-1 text-white-50">Total Revenue</h6>
                            <h3 id="kpiRevenue" class="fw-bold mb-0">$0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center shadow-sm border-0 bg-success text-white">
                        <div class="card-body">
                            <h6 class="card-subtitle mb-1 text-white-50">Total Records</h6>
                            <h3 id="kpiRecords" class="fw-bold mb-0">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center shadow-sm border-0 bg-info text-white">
                        <div class="card-body">
                            <h6 class="card-subtitle mb-1 text-white-50">Total Hours</h6>
                            <h3 id="kpiHours" class="fw-bold mb-0">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center shadow-sm border-0 bg-secondary text-white">
                        <div class="card-body">
                            <h6 class="card-subtitle mb-1 text-white-50">Avg Rate / Hr</h6>
                            <h3 id="kpiAvgRate" class="fw-bold mb-0">$0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart Visualizations Row -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white fw-bold">
                            📈 Monthly Revenue ($)
                        </div>
                        <div class="card-body">
                            <canvas id="revenueChart" style="max-height: 250px;"></canvas>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white fw-bold">
                            ⏱️ Total Hours Worked
                        </div>
                        <div class="card-body">
                            <canvas id="hoursChart" style="max-height: 250px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Month-Wise Sales Report Table -->
            <div class="card shadow mb-5">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">📅 Month-Wise Sales Report</h5>
                    <button class="btn btn-light btn-sm fw-bold" onclick="exportReportToExcel()">
                        📥 Export Report (Excel)
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Month</th>
                                    <th>Total Records</th>
                                    <th>Total Hours</th>
                                    <th>Avg Rate ($)</th>
                                    <th>Total Amount ($)</th>
                                </tr>
                            </thead>
                            <tbody id="reportsTable">
                                <tr>
                                    <td colspan="5" class="text-center">Loading Report...</td>
                                </tr>
                            </tbody>
                            <tfoot id="reportsFooter" class="table-secondary fw-bold">
                                <!-- Totals populated dynamically -->
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- External SheetJS Script -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
let reportData = [];
let revenueChartInstance = null;
let hoursChartInstance = null;

document.addEventListener("DOMContentLoaded", () => {
    generateMonthReport();
});

function getProp(obj, propName) {
    if (!obj) return "";
    const key = Object.keys(obj).find(k => k.toLowerCase() === propName.toLowerCase());
    return key ? obj[key] : "";
}

function generateMonthReport() {
    let salesData = [];
    try {
        const raw = localStorage.getItem("salesData");
        if (raw) salesData = JSON.parse(raw);
    } catch(e) {
        console.error("Error loading localStorage:", e);
    }

    const tbody = document.getElementById("reportsTable");
    const tfoot = document.getElementById("reportsFooter");

    if (!salesData || !Array.isArray(salesData) || salesData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No sales data available. Upload data from the Dashboard first.</td></tr>`;
        tfoot.innerHTML = "";
        return;
    }

    // Group data by Month
    const monthGroup = {};

    salesData.forEach(item => {
        let rawMonth = getProp(item, "month");
        const month = rawMonth ? String(rawMonth).trim() : "Unknown";
        
        const hours = Number(getProp(item, "hours")) || 0;
        const rate = Number(getProp(item, "rate")) || 0;
        const amount = Number(getProp(item, "amount")) || (hours * rate) || 0;

        if (!monthGroup[month]) {
            monthGroup[month] = {
                month: month,
                records: 0,
                hours: 0,
                totalRate: 0,
                amount: 0
            };
        }

        monthGroup[month].records += 1;
        monthGroup[month].hours += hours;
        monthGroup[month].totalRate += rate;
        monthGroup[month].amount += amount;
    });

    reportData = Object.values(monthGroup);

    // Render Table Rows
    let html = "";
    let grandRecords = 0;
    let grandHours = 0;
    let grandAmount = 0;
    let totalRateSum = 0;

    reportData.forEach(r => {
        const avgRate = r.records > 0 ? Math.round(r.totalRate / r.records) : 0;
        
        grandRecords += r.records;
        grandHours += r.hours;
        grandAmount += r.amount;
        totalRateSum += r.totalRate;

        html += `
        <tr>
            <td class="fw-bold">${r.month}</td>
            <td>${r.records.toLocaleString()}</td>
            <td>${r.hours.toLocaleString()} hrs</td>
            <td>$${avgRate.toLocaleString()}</td>
            <td class="text-success fw-bold">$${r.amount.toLocaleString()}</td>
        </tr>`;
    });

    tbody.innerHTML = html;

    // Render Footer Totals & KPI Cards
    const grandAvgRate = grandRecords > 0 ? Math.round(totalRateSum / grandRecords) : 0;
    
    document.getElementById("kpiRevenue").innerText = `$${grandAmount.toLocaleString()}`;
    document.getElementById("kpiRecords").innerText = grandRecords.toLocaleString();
    document.getElementById("kpiHours").innerText = `${grandHours.toLocaleString()} hrs`;
    document.getElementById("kpiAvgRate").innerText = `$${grandAvgRate.toLocaleString()}`;

    tfoot.innerHTML = `
    <tr>
        <td>Grand Total</td>
        <td>${grandRecords.toLocaleString()}</td>
        <td>${grandHours.toLocaleString()} hrs</td>
        <td>$${grandAvgRate.toLocaleString()} (Avg)</td>
        <td class="text-success">$${grandAmount.toLocaleString()}</td>
    </tr>`;

    // Render Charts
    renderCharts(reportData);
}

function renderCharts(data) {
    const labels = data.map(d => d.month);
    const amounts = data.map(d => d.amount);
    const hours = data.map(d => d.hours);

    if (revenueChartInstance) revenueChartInstance.destroy();
    if (hoursChartInstance) hoursChartInstance.destroy();

    // 1. Monthly Revenue Bar Chart
    const ctxRevenue = document.getElementById('revenueChart').getContext('2d');
    revenueChartInstance = new Chart(ctxRevenue, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Total Amount ($)',
                data: amounts,
                backgroundColor: 'rgba(25, 135, 84, 0.7)',
                borderColor: 'rgba(25, 135, 84, 1)',
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    // 2. Monthly Hours Line Chart
    const ctxHours = document.getElementById('hoursChart').getContext('2d');
    hoursChartInstance = new Chart(ctxHours, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Hours Worked',
                data: hours,
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointBackgroundColor: '#0d6efd'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}

function exportReportToExcel() {
    if (!reportData || reportData.length === 0) {
        alert("No report data available to export.");
        return;
    }

    const exportRows = reportData.map(r => ({
        "Month": r.month,
        "Total Records": r.records,
        "Total Hours": r.hours,
        "Avg Rate": r.records > 0 ? Math.round(r.totalRate / r.records) : 0,
        "Total Amount": r.amount
    }));

    const worksheet = XLSX.utils.json_to_sheet(exportRows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Monthly Report");

    XLSX.writeFile(workbook, "Monthly_Sales_Report.xlsx");
}
</script>

</body>
</html>
