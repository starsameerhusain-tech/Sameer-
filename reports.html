<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Sales Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">📊 Sales Management System</span>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <!-- Sidebar Navigation -->
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Menu
                </div>
                <div class="list-group list-group-flush">
                    <a href="index.html" class="list-group-item list-group-item-action">Dashboard / Sales</a>
                    <a href="reports.html" class="list-group-item list-group-item-action active">Reports</a>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-9">

            <!-- Debugging Info Alert -->
            <div id="debugAlert" class="alert alert-info py-2 small" style="display:none;"></div>

            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">📅 Month-Wise Sales Report</h5>
                    <button class="btn btn-light btn-sm fw-bold" onclick="exportReportToExcel()">
                        📥 Export Report (Excel)
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Month</th>
                                    <th>Total Records</th>
                                    <th>Total Hours</th>
                                    <th>Avg Rate ($)</th>
                                    <th>Total Amount ($)</th>
                                </tr>
                            </thead>
                            <tbody id="reportsTable">
                                <tr>
                                    <td colspan="5" class="text-center">Loading Report...</td>
                                </tr>
                            </tbody>
                            <tfoot id="reportsFooter" class="table-secondary fw-bold">
                                <!-- Totals populated dynamically -->
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- External Scripts -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
let reportData = [];

document.addEventListener("DOMContentLoaded", () => {
    generateMonthReport();
});

// Helper function to find property regardless of key casing
function getProp(obj, propName) {
    if (!obj) return "";
    const key = Object.keys(obj).find(k => k.toLowerCase() === propName.toLowerCase());
    return key ? obj[key] : "";
}

function generateMonthReport() {
    let salesData = [];
    let storageKey = "salesData";

    // Debugging alert setup
    const debugBox = document.getElementById("debugAlert");

    try {
        let raw = localStorage.getItem("salesData");
        
        // Fallback check if saved under a different key
        if (!raw) {
            const possibleKeys = Object.keys(localStorage);
            if (possibleKeys.length > 0) {
                storageKey = possibleKeys.find(k => k.toLowerCase().includes("sales")) || possibleKeys[0];
                raw = localStorage.getItem(storageKey);
            }
        }

        if (raw) {
            salesData = JSON.parse(raw);
        }
    } catch(e) {
        console.error("Error loading localStorage data:", e);
    }

    const tbody = document.getElementById("reportsTable");
    const tfoot = document.getElementById("reportsFooter");

    if (!salesData || !Array.isArray(salesData) || salesData.length === 0) {
        debugBox.style.display = "block";
        debugBox.className = "alert alert-warning py-2 small";
        debugBox.innerHTML = `⚠️ <strong>No sales data found in localStorage.</strong> Please go to <a href="index.html" class="alert-link">Dashboard</a> and upload your Excel file first.`;
        
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No sales data available. Upload data from the Dashboard first.</td></tr>`;
        tfoot.innerHTML = "";
        return;
    }

    debugBox.style.display = "block";
    debugBox.className = "alert alert-success py-2 small";
    debugBox.innerHTML = `✅ Successfully loaded <strong>${salesData.length} records</strong> from LocalStorage.`;

    // Group data by Month (handling casing)
    const monthGroup = {};

    salesData.forEach(item => {
        let rawMonth = getProp(item, "month");
        const month = rawMonth ? String(rawMonth).trim() : "Unknown";
        
        const hours = Number(getProp(item, "hours")) || 0;
        const rate = Number(getProp(item, "rate")) || 0;
        const amount = Number(getProp(item, "amount")) || (hours * rate) || 0;

        if (!monthGroup[month]) {
            monthGroup[month] = {
                month: month,
                records: 0,
                hours: 0,
                totalRate: 0,
                amount: 0
            };
        }

        monthGroup[month].records += 1;
        monthGroup[month].hours += hours;
        monthGroup[month].totalRate += rate;
        monthGroup[month].amount += amount;
    });

    reportData = Object.values(monthGroup);

    // Render Table Rows
    let html = "";
    let grandRecords = 0;
    let grandHours = 0;
    let grandAmount = 0;
    let totalRateSum = 0;

    reportData.forEach(r => {
        const avgRate = r.records > 0 ? Math.round(r.totalRate / r.records) : 0;
        
        grandRecords += r.records;
        grandHours += r.hours;
        grandAmount += r.amount;
        totalRateSum += r.totalRate;

        html += `
        <tr>
            <td class="fw-bold">${r.month}</td>
            <td>${r.records.toLocaleString()}</td>
            <td>${r.hours.toLocaleString()} hrs</td>
            <td>$${avgRate.toLocaleString()}</td>
            <td class="text-success fw-bold">$${r.amount.toLocaleString()}</td>
        </tr>`;
    });

    tbody.innerHTML = html;

    // Render Footer Totals
    const grandAvgRate = grandRecords > 0 ? Math.round(totalRateSum / grandRecords) : 0;
    tfoot.innerHTML = `
    <tr>
        <td>Grand Total</td>
        <td>${grandRecords.toLocaleString()}</td>
        <td>${grandHours.toLocaleString()} hrs</td>
        <td>$${grandAvgRate.toLocaleString()} (Avg)</td>
        <td class="text-success">$${grandAmount.toLocaleString()}</td>
    </tr>`;
}

function exportReportToExcel() {
    if (!reportData || reportData.length === 0) {
        alert("No report data available to export.");
        return;
    }

    const exportRows = reportData.map(r => ({
        "Month": r.month,
        "Total Records": r.records,
        "Total Hours": r.hours,
        "Avg Rate": r.records > 0 ? Math.round(r.totalRate / r.records) : 0,
        "Total Amount": r.amount
    }));

    const worksheet = XLSX.utils.json_to_sheet(exportRows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Monthly Report");

    XLSX.writeFile(workbook, "Monthly_Sales_Report.xlsx");
}
</script>

</body>
</html>
