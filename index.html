<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">📊 Sales Management System</span>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <!-- Sidebar Navigation -->
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Menu
                </div>
                <div class="list-group list-group-flush">
                    <a href="index.html" class="list-group-item list-group-item-action active">Dashboard / Sales</a>
                    <a href="reports.html" class="list-group-item list-group-item-action">Reports</a>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-9">

            <!-- Summary KPI Cards -->
            <div class="row">
                <div class="col-md-3">
                    <div class="card text-center shadow">
                        <div class="card-body">
                            <h6>Total Amount</h6>
                            <h3 id="totalSales">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center shadow">
                        <div class="card-body">
                            <h6>Total Records</h6>
                            <h3 id="totalCustomers">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center shadow">
                        <div class="card-body">
                            <h6>Total Hours</h6>
                            <h3 id="totalProducts">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center shadow">
                        <div class="card-body">
                            <h6>Avg Rate</h6>
                            <h3 id="totalQty">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Upload Section -->
            <div class="card shadow mt-4">
                <div class="card-header bg-success text-white">
                    Upload Monthly Sales
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <input type="file" id="excelFile" class="form-control" accept=".xlsx,.xls,.csv">
                        </div>
                        <div class="col-md-4">
                            <button type="button" class="btn btn-primary w-100" onclick="uploadExcel()">
                                Upload Excel
                            </button>
                        </div>
                    </div>
                    <div id="uploadStatus" class="mt-3 text-success fw-bold"></div>
                </div>
            </div>

            <!-- Search Section -->
            <div class="card shadow mt-4">
                <div class="card-header bg-info text-white">
                    Search Sales
                </div>
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-md-3">
                            <input 
                                type="text" 
                                id="customerSearch" 
                                class="form-control" 
                                placeholder="Name" 
                                oninput="filterAll()"
                            >
                        </div>
                        <div class="col-md-3">
                            <input 
                                type="text" 
                                id="emailSearch" 
                                class="form-control" 
                                placeholder="Email ID" 
                                oninput="filterAll()"
                            >
                        </div>
                        <div class="col-md-3">
                            <input 
                                type="text" 
                                id="monthSearch" 
                                class="form-control" 
                                placeholder="Month" 
                                oninput="filterAll()"
                            >
                        </div>
                        <div class="col-md-3">
                            <button 
                                type="button" 
                                class="btn btn-success w-100" 
                                onclick="filterAll()"
                            >
                                Search
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="card shadow mt-4">
                <div class="card-header bg-secondary text-white">
                    Sales Records
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Month</th>
                                <th>Project Name</th>
                                <th>Email ID</th>
                                <th>Name</th>
                                <th>Source</th>
                                <th>Language</th>
                                <th>Rate</th>
                                <th>Hours</th>
                                <th>Amount</th>
                                <th>Project Code</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="salesTable">
                            <tr>
                                <td colspan="11" class="text-center">No Data Available</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Download Action Buttons -->
            <div class="text-center mt-4 mb-5">
                <button type="button" class="btn btn-success me-2" onclick="downloadExcel()">
                    Download Excel
                </button>
                <button type="button" class="btn btn-danger" onclick="downloadCSV()">
                    Download CSV
                </button>
            </div>

        </div>
    </div>
</div>

<!-- External Scripts -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="script.js?v=4.0"></script>

</body>
</html>
