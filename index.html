<div class="card mb-4">
    <div class="card-header bg-success text-white">
        Upload Monthly Sales
    </div>
    <div class="card-body">
        <div class="row g-2 align-items-center">
            <div class="col-md-9">
                <!-- Accept both Excel and CSV -->
                <input type="file" id="excelFile" class="form-control" accept=".xlsx, .xls, .csv">
            </div>
            <div class="col-md-3">
                <button type="button" id="uploadBtn" class="btn btn-primary w-100">Upload Excel</button>
            </div>
        </div>
        <div id="uploadStatus" class="mt-2"></div>
    </div>
</div>
