<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #0b3c5d;
            color: #fff;
        }
        .sidebar a {
            color: #d9e1e8;
            text-decoration: none;
        }
        .sidebar a:hover, .sidebar a.active {
            color: #fff;
            background-color: #1d2731;
        }
        .card-kpi {
            border-left: 4px solid #328cc1;
        }
        /* Style for editable input fields */
        .edit-input {
            width: 100%;
            padding: 2px 4px;
            font-size: 0.85rem;
            border: 1px solid #0d47a1;
            border-radius: 4px;
            background-color: #e8f0fe;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar navbar-dark bg-primary px-3 shadow-sm" style="background-color: #0d47a1 !important;">
        <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-chart-line me-2"></i>Sales Management System</span>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3 d-none d-md-block">
                <h6 class="text-uppercase text-muted fw-bold mb-3">Menu</h6>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a href="index.html" class="nav-link active rounded p-2"><i class="fa-solid fa-gauge me-2"></i>Dashboard / Sales</a>
                    </li>
                    <li class="nav-item">
                        <a href="reports.html" class="nav-link rounded p-2"><i class="fa-solid fa-file-invoice me-2"></i>Reports</a>
                    </li>
                </ul>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-10 p-4">
                
                <!-- KPI Dashboard Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="card card-kpi shadow-sm p-3 bg-white rounded">
                            <div class="text-muted small">Total Amount</div>
                            <div class="fs-3 fw-bold text-dark" id="totalAmount">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-kpi shadow-sm p-3 bg-white rounded">
                            <div class="text-muted small">Total Records</div>
                            <div class="fs-3 fw-bold text-dark" id="totalRecords">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-kpi shadow-sm p-3 bg-white rounded">
                            <div class="text-muted small">Total Hours</div>
                            <div class="fs-3 fw-bold text-dark" id="totalHours">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-kpi shadow-sm p-3 bg-white rounded">
                            <div class="text-muted small">Avg Rate</div>
                            <div class="fs-3 fw-bold text-dark" id="avgRate">0</div>
                        </div>
                    </div>
                </div>

                <!-- File Upload Card -->
                <div class="card mb-4 shadow-sm">
                    <div class="card-header bg-success text-white fw-bold">
                        <i class="fa-solid fa-file-excel me-2"></i>Upload Monthly Sales
                    </div>
                    <div class="card-body">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-9">
                                <input type="file" id="excelFile" class="form-control" accept=".xlsx, .xls, .csv">
                            </div>
                            <div class="col-md-3">
                                <button type="button" id="uploadBtn" class="btn btn-primary w-100" style="background-color: #0d47a1;">Upload Excel</button>
                            </div>
                        </div>
                        <div id="uploadStatus" class="mt-2"></div>
                    </div>
                </div>

                <!-- Search Card -->
                <div class="card mb-4 shadow-sm">
                    <div class="card-header bg-info text-white fw-bold" style="background-color: #00838f !important;">
                        <i class="fa-solid fa-magnifying-glass me-2"></i>Search Sales
                    </div>
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <input type="text" id="searchName" class="form-control" placeholder="Name">
                            </div>
                            <div class="col-md-4">
                                <input type="text" id="searchEmail" class="form-control" placeholder="Email ID">
                            </div>
                            <div class="col-md-3">
                                <input type="text" id="searchMonth" class="form-control" placeholder="Month">
                            </div>
                            <div class="col-md-2">
                                <button type="button" id="searchBtn" class="btn btn-success w-100">Search</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sales Data Table Card -->
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fa-solid fa-table me-2"></i>Sales Records
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0 align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Month</th>
                                        <th>Project Name</th>
                                        <th>Email ID</th>
                                        <th>Name</th>
                                        <th>Source</th>
                                        <th>Language</th>
                                        <th>Rate</th>
                                        <th>Hours</th>
                                        <th>Amount</th>
                                        <th>Project Code</th>
                                        <th class="text-center" style="width: 100px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="salesTableBody">
                                    <tr>
                                        <td colspan="11" class="text-center py-4 text-muted">No Data Available</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- SheetJS (XLSX) Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
