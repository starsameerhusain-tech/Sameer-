<!-- Table Container -->
                <div class="card panel-card overflow-hidden mb-4">
                    <div class="panel-header-blue d-flex align-items-center justify-content-between">
                        <span><i class="fa-solid fa-table me-2"></i> Sales Records</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-custom align-middle">
                            <thead>
                                <tr>
                                    <th>Month</th>
                                    <th>Project</th>
                                    <th>Email ID</th>
                                    <th>Client Name</th>
                                    <th>Source</th>
                                    <th>Language</th>
                                    <th>Rate</th>
                                    <th>Hours</th>
                                    <th>Amount</th>
                                    <th>Code</th>
                                    <th class="text-center" style="width: 120px;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="salesTableBody">
                                <tr>
                                    <td colspan="11" class="text-center py-5 text-muted">
                                        <i class="fa-regular fa-folder-open fs-2 d-block mb-2 text-secondary"></i>
                                        No Data Available
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Export / Download Section -->
                <div class="d-flex justify-content-end gap-2 mb-5">
                    <button type="button" class="btn btn-success fw-semibold px-4 rounded-3 shadow-sm" onclick="downloadFile('excel')">
                        <i class="fa-solid fa-file-excel me-2"></i> Download Excel
                    </button>
                    <button type="button" class="btn btn-primary fw-semibold px-4 rounded-3 shadow-sm" onclick="downloadFile('csv')">
                        <i class="fa-solid fa-file-csv me-2"></i> Download CSV
                    </button>
                </div>
