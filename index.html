<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f6f9;
            --sidebar-bg: #1e293b;
            --sidebar-active: #0f172a;
            --primary-accent: #2563eb;
            --card-border-radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #334155;
        }

        /* Top Navbar */
        .navbar-custom {
            background-color: var(--sidebar-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Sidebar Styling */
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: var(--sidebar-bg);
            border-right: 1px solid #334155;
        }

        .sidebar .nav-link {
            color: #94a3b8;
            font-weight: 500;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }

        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: #ffffff;
            background-color: var(--primary-accent);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* Metric Cards */
        .card-kpi {
            border: none;
            border-radius: var(--card-border-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .card-kpi:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-kpi .kpi-icon {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 1.8rem;
            opacity: 0.15;
        }

        /* Top Accent Lines on Cards */
        .border-accent-blue { border-top: 4px solid #2563eb; }
        .border-accent-green { border-top: 4px solid #10b981; }
        .border-accent-purple { border-top: 4px solid #8b5cf6; }
        .border-accent-amber { border-top: 4px solid #f59e0b; }

        /* Container & Panels */
        .panel-card {
            border: none;
            border-radius: var(--card-border-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }

        .panel-header {
            background-color: transparent;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            color: #1e293b;
            padding: 16px 20px;
        }

        /* Table Design */
        .table-custom {
            margin-bottom: 0;
        }

        .table-custom thead th {
            background-color: #f8fafc;
            color: #475569;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid #e2e8f0;
            padding: 12px 16px;
        }

        .table-custom tbody td {
            padding: 14px 16px;
            color: #334155;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .table-custom tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Badges & Inputs */
        .form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
        }

        .form-control:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-custom-primary {
            background-color: var(--primary-accent);
            color: white;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
            border: none;
            transition: background 0.2s;
        }

        .btn-custom-primary:hover {
            background-color: #1d4ed8;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-dark navbar-custom px-4 py-2">
        <div class="container-fluid p-0">
            <span class="navbar-brand fw-bold fs-5">
                <i class="fa-solid fa-chart-pie text-primary me-2"></i>Sales Analytics Suite
            </span>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill">
                    <i class="fa-solid fa-circle text-success me-1 style="font-size: 8px;"></i> System Live
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div class="col-md-2 sidebar p-3 d-none d-md-block">
                <div class="text-uppercase small fw-bold text-muted mb-3 px-2">Overview</div>
                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link active">
                            <i class="fa-solid fa-house me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="reports.html" class="nav-link">
                            <i class="fa-solid fa-chart-simple me-2"></i>Reports
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-10 p-4">
                
                <!-- KPI Dashboard Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="card card-kpi border-accent-blue p-3">
                            <i class="fa-solid fa-dollar-sign kpi-icon text-primary"></i>
                            <div class="text-muted small fw-medium mb-1">Total Revenue</div>
                            <div class="fs-3 fw-bold text-dark" id="totalAmount">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-kpi border-accent-green p-3">
                            <i class="fa-solid fa-file-lines kpi-icon text-success"></i>
                            <div class="text-muted small fw-medium mb-1">Total Orders</div>
                            <div class="fs-3 fw-bold text-dark" id="totalRecords">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-kpi border-accent-purple p-3">
                            <i class="fa-solid fa-clock kpi-icon text-purple" style="color: #8b5cf6;"></i>
                            <div class="text-muted small fw-medium mb-1">Total Hours</div>
                            <div class="fs-3 fw-bold text-dark" id="totalHours">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-kpi border-accent-amber p-3">
                            <i class="fa-solid fa-calculator kpi-icon text-warning"></i>
                            <div class="text-muted small fw-medium mb-1">Avg Rate / Hr</div>
                            <div class="fs-3 fw-bold text-dark" id="avgRate">0</div>
                        </div>
                    </div>
                </div>

                <!-- File Import Section -->
                <div class="card panel-card mb-4">
                    <div class="panel-header d-flex align-items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up text-primary"></i> Data Ingestion
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-9">
                                <input type="file" id="excelFile" class="form-control" accept=".xlsx, .xls, .csv">
                            </div>
                            <div class="col-md-3">
                                <button type="button" id="uploadBtn" class="btn btn-custom-primary w-100">
                                    <i class="fa-solid fa-upload me-2"></i>Upload File
                                </button>
                            </div>
                        </div>
                        <div id="uploadStatus"></div>
                    </div>
                </div>

                <!-- Search & Filters Panel -->
                <div class="card panel-card mb-4">
                    <div class="panel-header d-flex align-items-center gap-2">
                        <i class="fa-solid fa-filter text-secondary"></i> Quick Filters
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label small text-muted fw-semibold">Search Name</label>
                                <input type="text" id="searchName" class="form-control" placeholder="e.g. John Doe">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted fw-semibold">Filter Email</label>
                                <input type="text" id="searchEmail" class="form-control" placeholder="user@company.com">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small text-muted fw-semibold">Select Month</label>
                                <input type="text" id="searchMonth" class="form-control" placeholder="e.g. January">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="button" id="searchBtn" class="btn btn-outline-secondary w-100 rounded-3" style="padding: 10px;">
                                    <i class="fa-solid fa-rotate-right me-1"></i> Reset / Filter
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Table Container -->
                <div class="card panel-card overflow-hidden">
                    <div class="panel-header d-flex align-items-center justify-content-between">
                        <span><i class="fa-solid fa-table-list text-primary me-2"></i> Sales Records</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-custom align-middle">
                            <thead>
                                <tr>
                                    <th>Month</th>
                                    <th>Project</th>
                                    <th>Email ID</th>
                                    <th>Client Name</th>
                                    <th>Source</th>
                                    <th>Language</th>
                                    <th>Rate</th>
                                    <th>Hours</th>
                                    <th>Amount</th>
                                    <th>Code</th>
                                </tr>
                            </thead>
                            <tbody id="salesTableBody">
                                <tr>
                                    <td colspan="10" class="text-center py-5 text-muted">
                                        <i class="fa-regular fa-folder-open fs-2 d-block mb-2"></i>
                                        No Records Found
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- SheetJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Custom JS logic -->
    <script src="script.js"></script>
</body>
</html>
